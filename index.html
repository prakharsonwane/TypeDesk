<!DOCTYPE html><html>
<head>
  <title>Type Desk</title>  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    /* LOGIN + MODE SAME BG */
    #loginPage, #modePage {
      background: #e0f2fe;
      height: 100vh;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      color: black;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    input, button {
      padding: 10px;
      margin: 10px;
      width: 85%;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #0ea5e9;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0284c7;
    }

    .hidden { display: none; }

    .game-box {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 20px;
      font-size: 18px;
      border-radius: 8px;
    }

    .correct { color: #22c55e; }
    .wrong { color: #ef4444; }

    .stats {
      margin-top: 10px;
    }
  </style></head><body><!-- LOGIN --><div id="loginPage" class="center">
  <div class="card">
    <h2>Type Desk</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <input id="color" placeholder="Favourite Color">
    <button id="loginBtn">Login / Register</button>
    <button id="forgotBtn">Forgot Password?</button>
  </div>
</div><!-- MODE --><div id="modePage" class="hidden center">
  <div class="card">
    <h2 id="welcome"></h2>
    <button onclick="startGame('easy')">Easy</button>
    <button onclick="startGame('medium')">Medium</button>
    <button onclick="startGame('hard')">Hard</button>
    <button onclick="startGame('extreme')">Extreme</button>
  </div>
</div><!-- GAME --><div id="gamePage" class="hidden">
  <div class="game-box">
    <h2 id="modeTitle"></h2>
    <h3>Level: <span id="level">1</span></h3>
    <p id="text"></p><textarea id="input"></textarea>

<div class="stats">
  ⏱ Time: <span id="time">30</span>s |
  🎯 Accuracy: <span id="accuracy">0</span>% |
  🏆 Score: <span id="score">0</span>
</div>

<button onclick="nextLevel()">Next Level</button>
<button onclick="restart()">Restart</button>
<button onclick="goBack()">⬅ Back</button>

  </div>
</div><script>

window.onload=function(){

let score=0,correctChars=0,totalChars=0;
const username=document.getElementById("username");
const password=document.getElementById("password");
const color=document.getElementById("color");

// LOGIN
document.getElementById("loginBtn").onclick=function(){
const user=username.value;
const pass=password.value;
const col=color.value;

if(!user||!pass||!col){alert("Fill all");return;}

const stored=localStorage.getItem(user);

if(!stored){
localStorage.setItem(user,JSON.stringify({password:pass,color:col}));
}else{
const data=JSON.parse(stored);
if(data.password!==pass){
alert("Wrong password!");
return;
}
}

document.getElementById("welcome").innerText="Welcome, "+user+" 👋";

loginPage.classList.add("hidden");
modePage.classList.remove("hidden");
};

// FORGOT
document.getElementById("forgotBtn").onclick=function(){
const user=prompt("Enter username:");
const stored=localStorage.getItem(user);
if(!stored){alert("User not found");return;}

const col=prompt("Enter favourite color:");
const data=JSON.parse(stored);

if(data.color===col){
alert("Password: "+data.password);
}else{
alert("Wrong color");
}
};

// DATA
const dataSet={
easy:["Cat runs.","Sun is bright.","Dog plays.","Sky blue.","Water clear.","Trees green.","Fish swim.","Practice daily.","Typing fun.","Stay consistent."],
medium:["Typing improves speed.","Practice daily typing.","Focus on words.","Consistency is key.","Reduce errors.","Typing helps.","Work smart.","Accuracy matters.","Stay calm.","Typing essential."],
hard:["Typing requires focus, patience, and practice.","Improving typing speed takes effort.","Accuracy should not be ignored.","Challenging paragraphs improve concentration.","Typing tests enhance speed and focus.","Complex sentences improve skills.","Stay focused and avoid distractions.","Hard tests demand control.","Maintain rhythm and accuracy.","Practice regularly."],
extreme:["Advanced typing requires skills: speed, accuracy, and endurance; without these, progress slows.","Long paragraphs test ability.","Consistency is important; without focus improvement is difficult.","Typing under pressure builds control.","Extreme tests push limits.","Maintaining accuracy is challenging; practice helps.","Complex structures improve precision.","\"Practice daily,\" experts say.","Typing requires coordination.","Final challenge: test your speed."]
};

let mode="",level=1,timer,timeLeft;

// START
window.startGame=function(m){
mode=m;level=1;score=0;
document.getElementById("score").innerText=0;

modePage.classList.add("hidden");
gamePage.classList.remove("hidden");

document.getElementById("modeTitle").innerText=mode.toUpperCase();
loadLevel();
};

// LOAD
function loadLevel(){
document.getElementById("text").innerText=dataSet[mode][level-1];
document.getElementById("level").innerText=level;

timeLeft=mode==="easy"?30:mode==="medium"?45:60;
document.getElementById("time").innerText=timeLeft;

document.getElementById("input").value="";

clearInterval(timer);
timer=setInterval(()=>{
timeLeft--;
document.getElementById("time").innerText=timeLeft;

if(timeLeft<=5&&timeLeft>0)beep();

if(timeLeft===0){
clearInterval(timer);
alert("Time up!");
}
},1000);
}

// INPUT
document.getElementById("input").addEventListener("input",function(){
const text=dataSet[mode][level-1];
const typed=this.value;

let result="";correctChars=0;

for(let i=0;i<text.length;i++){
if(typed[i]==null) result+=text[i];
else if(typed[i]===text[i]){
result+=`<span class="correct">${text[i]}</span>`;
correctChars++;
}else{
result+=`<span class="wrong">${text[i]}</span>`;
}
}

totalChars=text.length;
document.getElementById("text").innerHTML=result;

document.getElementById("accuracy").innerText=
Math.floor((correctChars/totalChars)*100);
});

// NEXT
window.nextLevel=function(){
const input=document.getElementById("input").value.trim();
const correct=dataSet[mode][level-1].trim();

if(input!==correct){
alert("Complete correctly!");
return;
}

score+=mode==="easy"?10:mode==="medium"?20:mode==="hard"?30:50;
document.getElementById("score").innerText=score;

if(level<10){
level++;
loadLevel();
}else{
alert("🎉 Completed!");
goBack();
}
};

// BACK
window.goBack=function(){
clearInterval(timer);
gamePage.classList.add("hidden");
modePage.classList.remove("hidden");
};

// RESTART
window.restart=function(){loadLevel();};

// SOUND
function beep(){
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+0.1);
}

};

</script></body>
</html>
