<!DOCTYPE html>
<html>
<head>
  <title>Type Desk</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    /* GAME */
    .game-box {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 20px;
      font-size: 18px;
      padding: 10px;
    }

    .stats {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="center">
  <div class="card">
    <h2>Type Desk</h2>
    <p>Login / Register</p>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Enter</button>
  </div>
</div>

<!-- GAME PAGE -->
<div id="gamePage" class="hidden">
  <div class="game-box">
    <h1>Type Desk</h1>

    <h3>Level: <span id="level">1</span></h3>

    <p id="text"></p>

    <textarea id="input" placeholder="Start typing..."></textarea>

    <div class="stats">
      ⏱ Time: <span id="time">30</span>s
    </div>

    <button onclick="restart()">Restart</button>
  </div>
</div>

<script>
let level = 1;
let timeLeft = 30;
let timer;

// Levels
const levels = [
  "The sun is bright and the sky is blue.",
  "Typing fast needs practice and focus every day.",
  "Small steps lead to big success in learning typing.",

  "Typing is an essential skill in the modern world. It helps you work faster and communicate efficiently.",
  "Practice daily with focus and patience. Accuracy is more important than speed in the beginning stages.",
  "As you improve your typing skills, you will notice better speed and fewer mistakes over time.",

  "Consistency, discipline, and focus are the keys to mastering typing skills. Complex sentences with punctuation improve your overall ability.",
  "Advanced typing requires precision and speed. Errors must be minimized while maintaining a steady rhythm throughout the paragraph.",
  "Typing challenges become more difficult as you progress. Longer texts demand concentration, accuracy, and endurance from the user.",
  "Congratulations! You are attempting the final level. This paragraph is designed to test your maximum typing speed, accuracy, and patience under pressure."
];

// LOGIN
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (!user || !pass) {
    alert("Fill all fields");
    return;
  }

  localStorage.setItem(user, pass);

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  loadLevel();
}

// LOAD LEVEL
function loadLevel() {
  document.getElementById("level").innerText = level;
  document.getElementById("text").innerText = levels[level - 1];

  if (level <= 3) timeLeft = 30;
  else if (level <= 6) timeLeft = 45;
  else timeLeft = 60;

  document.getElementById("time").innerText = timeLeft;

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;

    if (timeLeft === 0) {
      clearInterval(timer);
      alert("⏰ Time's up!");
    }
  }, 1000);
}

// TYPING CHECK
document.getElementById("input").addEventListener("input", function() {
  const currentText = levels[level - 1];

  if (this.value === currentText) {
    clearInterval(timer);

    if (level < 10) {
      level++;
      alert("Level Up 🚀");
      this.value = "";
      loadLevel();
    } else {
      alert("🎉 All levels completed!");
    }
  }
});

// RESTART
function restart() {
  document.getElementById("input").value = "";
  loadLevel();
}
</script>

</body>
</html>
