<!DOCTYPE html><html>
<head>
  <title>Type Desk</title>  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    /* LOGIN PAGE BLUE */
    #loginPage {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      width: 100%;
      height: 100vh;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      color: black;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
    }

    input, button {
      padding: 10px;
      margin: 10px;
      width: 80%;
    }

    .hidden { display: none; }

    .game-box {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 20px;
      font-size: 18px;
    }

    .correct { color: #22c55e; }
    .wrong { color: #ef4444; }
  </style></head><body><!-- LOGIN --><div id="loginPage" class="center">
  <div class="card">
    <h2>Type Desk</h2><input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<input id="color" placeholder="Favourite Color">

<button onclick="login()">Login / Register</button>
<button onclick="forgotPassword()">Forgot Password?</button>

  </div>
</div><!-- MODE --><div id="modePage" class="hidden center">
  <div class="card" style="background:#1e293b;color:white;">
    <h2>Select Mode</h2>
    <button onclick="startGame('easy')">Easy</button>
    <button onclick="startGame('medium')">Medium</button>
    <button onclick="startGame('hard')">Hard</button>
    <button onclick="startGame('extreme')">Extreme</button>
  </div>
</div><!-- GAME --><div id="gamePage" class="hidden">
  <div class="game-box">
    <h2 id="modeTitle"></h2>
    <h3>Level: <span id="level">1</span></h3><p id="text"></p>

<textarea id="input"></textarea>

<p>⏱ Time: <span id="time">30</span>s</p>

<button onclick="nextLevel()">Next Level</button>
<button onclick="restart()">Restart</button>

  </div>
</div><script>

// LOGIN
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  const color = document.getElementById("color").value;

  if (!user || !pass || !color) {
    alert("Fill all fields");
    return;
  }

  const data = { password: pass, color: color };
  localStorage.setItem(user, JSON.stringify(data));

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("modePage").classList.remove("hidden");
}

// FORGOT PASSWORD
function forgotPassword() {
  const user = prompt("Enter username:");
  const color = prompt("Enter favourite color:");

  const stored = localStorage.getItem(user);
  if (!stored) return alert("User not found!");

  const data = JSON.parse(stored);

  if (data.color === color) {
    alert("Your password is: " + data.password);
  } else {
    alert("Wrong colour!");
  }
}

// LEVEL DATA
const dataSet = {

  easy: [
    "Cat runs.",
    "Sun is bright.",
    "Dog plays outside.",
    "Sky is blue. Birds fly.",
    "Water is clear. Fire is hot.",
    "Trees are green. Milk is white.",
    "Fish swim fast. Air is fresh.",
    "Practice typing daily. Improve slowly.",
    "Typing is fun. Keep practicing daily.",
    "Small steps lead to success. Stay consistent always."
  ],

  medium: [
    "Typing improves speed and accuracy.",
    "Practice daily typing to improve performance.",
    "Focus on each word carefully while typing.",
    "Consistency is key to mastering typing skills.",
    "Errors should be reduced with regular practice.",
    "Typing helps in faster communication online.",
    "Work smart, and practice regularly to improve.",
    "Accuracy matters more than speed initially.",
    "Stay calm, focused, and keep improving daily.",
    "Typing is an essential skill in the modern world."
  ],

  hard: [
    "Typing requires focus, patience, and regular practice.",
    "Improving typing speed takes time, effort, and dedication.",
    "Accuracy should never be ignored, because mistakes reduce speed.",
    "Challenging paragraphs improve concentration, and build habits.",
    "Typing tests enhance speed, accuracy, and mental focus together.",
    "Complex sentences, with punctuation, improve typing ability.",
    "Stay focused, avoid distractions, and keep practicing daily.",
    "Hard typing tests demand concentration, patience, and control.",
    "Maintain rhythm, accuracy, and speed while typing paragraphs.",
    "Practice regularly, stay disciplined, and achieve mastery."
  ],

  extreme: [
    "Advanced typing requires multiple skills: speed, accuracy, and endurance; without these, progress becomes slow.",
    "Long paragraphs, with punctuation and complex words, test the true ability of a typist.",
    "Consistency is important; however, without focus, improvement becomes difficult.",
    "Typing under pressure improves reaction time, and builds better keyboard control.",
    "Extreme tests push your limits: speed must increase, accuracy must remain stable.",
    "Maintaining accuracy in long texts is challenging; however, practice makes it easier.",
    "Complex structures, including commas, colons, and semicolons, improve precision.",
    "\"Practice daily,\" experts say, because consistency builds confidence.",
    "Typing efficiently requires coordination between mind and hands; without it, speed suffers.",
    "Final challenge: test your speed, accuracy, and patience under strict conditions."
  ]
};

let mode = "";
let level = 1;
let timer;
let timeLeft;

// START GAME
function startGame(m) {
  mode = m;
  level = 1;

  document.getElementById("modePage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  document.getElementById("modeTitle").innerText = mode.toUpperCase();
  loadLevel();
}

// LOAD LEVEL
function loadLevel() {
  const text = dataSet[mode][level - 1];
  document.getElementById("text").innerText = text;
  document.getElementById("level").innerText = level;

  timeLeft = mode === "easy" ? 30 : mode === "medium" ? 45 : 60;
  document.getElementById("time").innerText = timeLeft;

  document.getElementById("input").value = "";

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;

    if (timeLeft <= 5 && timeLeft > 0) beep();

    if (timeLeft === 0) {
      clearInterval(timer);
      alert("Time up!");
    }
  }, 1000);
}

// TYPING HIGHLIGHT
document.getElementById("input").addEventListener("input", function() {
  const text = dataSet[mode][level - 1];
  const typed = this.value;

  let result = "";

  for (let i = 0; i < text.length; i++) {
    if (typed[i] == null) {
      result += text[i];
    } else if (typed[i] === text[i]) {
      result += `<span class="correct">${text[i]}</span>`;
    } else {
      result += `<span class="wrong">${text[i]}</span>`;
    }
  }

  document.getElementById("text").innerHTML = result;
});

// NEXT LEVEL
function nextLevel() {
  const input = document.getElementById("input").value;
  const correct = dataSet[mode][level - 1];

  if (input !== correct) {
    alert("Complete correctly first!");
    return;
  }

  if (level < 10) {
    level++;
    loadLevel();
  } else {
    alert("🎉 Mode Completed!");
  }
}

// RESTART
function restart() {
  loadLevel();
}

// SOUND
function beep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}

</script></body>
</html>
