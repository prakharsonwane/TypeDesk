<!DOCTYPE html><html>
<head>
  <title>Type Desk</title>  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    /* LIGHT BLUE LOGIN */
    #loginPage {
      background: #e0f2fe;
      width: 100%;
      height: 100vh;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      color: black;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
    }

    input, button {
      padding: 10px;
      margin: 10px;
      width: 80%;
    }

    .hidden { display: none; }

    .game-box {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 20px;
      font-size: 18px;
    }

    .correct { color: #22c55e; }
    .wrong { color: #ef4444; }
  </style></head><body><!-- LOGIN --><div id="loginPage" class="center">
  <div class="card">
    <h2>Type Desk</h2><input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<input id="color" placeholder="Favourite Color">

<button onclick="login()">Login / Register</button>
<button onclick="forgotPassword()">Forgot Password?</button>

  </div>
</div><!-- MODE --><div id="modePage" class="hidden center">
  <div class="card" style="background:#1e293b;color:white;">
    <h2>Select Mode</h2>
    <button onclick="startGame('easy')">Easy</button>
    <button onclick="startGame('medium')">Medium</button>
    <button onclick="startGame('hard')">Hard</button>
    <button onclick="startGame('extreme')">Extreme</button>
  </div>
</div><!-- GAME --><div id="gamePage" class="hidden">
  <div class="game-box">
    <h2 id="modeTitle"></h2>
    <h3>Level: <span id="level">1</span></h3><p id="text"></p>

<textarea id="input" placeholder="Start typing..."></textarea>

<p>⏱ Time: <span id="time">30</span>s</p>

<button onclick="nextLevel()">Next Level</button>
<button onclick="restart()">Restart</button>
<br><br>
<button onclick="goBack()">⬅ Back</button>

  </div>
</div><script>

// LOGIN
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  const color = document.getElementById("color").value;

  if (!user || !pass || !color) {
    alert("Fill all fields (including favourite color)");
    return;
  }

  const data = { password: pass, color: color };
  localStorage.setItem(user, JSON.stringify(data));

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("modePage").classList.remove("hidden");
}

// FORGOT PASSWORD
function forgotPassword() {
  const user = prompt("Enter username:");
  if (!user) return;

  const stored = localStorage.getItem(user);
  if (!stored) {
    alert("User not found!");
    return;
  }

  const color = prompt("Enter favourite color:");
  if (!color) {
    alert("Please enter favourite color!");
    return;
  }

  const data = JSON.parse(stored);

  if (data.color === color) {
    alert("Your password is: " + data.password);
  } else {
    alert("Wrong favourite color!");
  }
}

// DATA (same as before)
const dataSet = {
  easy: ["Cat runs.","Sun is bright.","Dog plays outside.","Sky is blue. Birds fly.","Water is clear. Fire is hot.","Trees are green. Milk is white.","Fish swim fast. Air is fresh.","Practice typing daily.","Typing is fun.","Small steps lead to success."],
  medium: ["Typing improves speed and accuracy.","Practice daily typing.","Focus on each word carefully.","Consistency is key.","Errors should be reduced.","Typing helps communication.","Work smart and practice.","Accuracy matters.","Stay calm and focused.","Typing is essential."],
  hard: ["Typing requires focus, patience, and regular practice.","Improving typing speed takes time and effort.","Accuracy should not be ignored, because mistakes reduce speed.","Challenging paragraphs improve concentration.","Typing tests enhance speed and focus.","Complex sentences, with punctuation, improve skills.","Stay focused and avoid distractions.","Hard typing tests demand control.","Maintain rhythm and accuracy.","Practice regularly to master typing."],
  extreme: ["Advanced typing requires skills: speed, accuracy, and endurance; without these, progress slows.","Long paragraphs test ability.","Consistency is important; without focus improvement is difficult.","Typing under pressure builds control.","Extreme tests push limits: speed must increase.","Maintaining accuracy is challenging; practice helps.","Complex structures, including commas and colons, improve precision.","\"Practice daily,\" experts say.","Typing requires coordination between mind and hands.","Final challenge: test your speed and patience."]
};

let mode="", level=1, timer, timeLeft;

// START
function startGame(m) {
  mode = m;
  level = 1;

  document.getElementById("modePage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  document.getElementById("modeTitle").innerText = mode.toUpperCase();
  loadLevel();
}

// LOAD
function loadLevel() {
  document.getElementById("text").innerText = dataSet[mode][level-1];
  document.getElementById("level").innerText = level;

  timeLeft = mode==="easy"?30:mode==="medium"?45:60;
  document.getElementById("time").innerText = timeLeft;

  document.getElementById("input").value = "";

  clearInterval(timer);
  timer = setInterval(()=>{
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;

    if(timeLeft<=5 && timeLeft>0) beep();

    if(timeLeft===0){
      clearInterval(timer);
      alert("Time up!");
    }
  },1000);
}

// TYPING
document.getElementById("input").addEventListener("input", function(){
  const text = dataSet[mode][level-1];
  const typed = this.value;

  let result="";
  for(let i=0;i<text.length;i++){
    if(typed[i]==null) result+=text[i];
    else if(typed[i]===text[i]) result+=`<span class="correct">${text[i]}</span>`;
    else result+=`<span class="wrong">${text[i]}</span>`;
  }

  document.getElementById("text").innerHTML=result;
});

// NEXT
function nextLevel(){
  const input=document.getElementById("input").value;
  const correct=dataSet[mode][level-1];

  if(input!==correct){
    alert("Complete correctly first!");
    return;
  }

  if(level<10){
    level++;
    loadLevel();
  } else {
    alert("🎉 Mode Completed!");
  }
}

// RESTART
function restart(){
  loadLevel();
}

// BACK TO MODE SELECT
function goBack(){
  clearInterval(timer);
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("modePage").classList.remove("hidden");
}

// SOUND
function beep(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+0.1);
}

</script></body>
</html>
